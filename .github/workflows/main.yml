name: TikTok Agent - Automatic Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Tema do vídeo"
        required: true
        type: string
      confirm_render:
        description: "Autorizar geração e renderização com créditos OpenAI e Shotstack"
        required: true
        type: boolean
        default: false
      language:
        description: "Idioma falado (ex.: pt-PT, pt-BR, en-US)"
        required: false
        type: string
        default: "pt-PT"
      duration:
        description: "Duração alvo em segundos (10-90)"
        required: false
        type: string
        default: "30"
      shotstack_env:
        description: "Ambiente Shotstack (stage = marca de água, sem custo de render; production = vídeo final)"
        required: false
        type: choice
        options:
          - stage
          - production
        default: stage

permissions:
  contents: read

jobs:
  create-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Offline tests (mocked APIs, no keys, no cost). Stops the run if the pipeline is broken.
      - name: Test pipeline
        run: npm test

      # Inputs and secrets reach the script only through environment variables.
      - name: Generate script and video
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SHOTSTACK_API_KEY: ${{ secrets.SHOTSTACK_API_KEY }}
          SHOTSTACK_ENV: ${{ inputs.shotstack_env }}
          TOPIC: ${{ inputs.topic }}
          LANGUAGE: ${{ inputs.language }}
          DURATION: ${{ inputs.duration }}
          CONFIRM_RENDER: ${{ inputs.confirm_render }}
        run: |
          args=(--topic "$TOPIC" --language "$LANGUAGE" --duration "$DURATION" --out output)
          if [ "$CONFIRM_RENDER" = "true" ]; then
            args+=(--confirm)
          fi
          node pipeline/src/run.js "${args[@]}"

      - name: Save outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-video-files
          path: output/
          if-no-files-found: ignore
